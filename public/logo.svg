<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="21" y="12" width="26" height="30" rx="1"/>
    </clipPath>
  </defs>

  <!-- second print peeking out behind -->
  <rect x="16" y="9" width="34" height="48" rx="3" fill="#d4d4d8"
        transform="rotate(-10 33 33)"/>

  <!-- front print: thin top/side border, thick chin -->
  <rect x="17" y="8" width="34" height="48" rx="3" fill="#ffffff"
        stroke="#18181b" stroke-width="2"/>
  <g clip-path="url(#photo)">
    <rect x="21" y="12" width="26" height="30" fill="url(#sky)"/>
    <circle cx="34" cy="30" r="6" fill="#fde68a"/>
    <path d="M21 42V35q7-6 13-1t13-2v10z" fill="#1e1b4b" opacity="0.85"/>
  </g>

  <!-- crop marks -->
  <g stroke="#ec4899" stroke-width="2" stroke-linecap="round">
    <path d="M17 2v3M11 8h3"/>
    <path d="M51 2v3M57 8h-3"/>
    <path d="M17 62v-3M11 56h3"/>
    <path d="M51 62v-3M57 56h-3"/>
  </g>
</svg>
